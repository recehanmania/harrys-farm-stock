  <script>
    // V38: bersihkan service worker lama tanpa reload halaman.
    (function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
          .catch(function(){});
      }
      if ("caches" in window) {
        caches.keys()
          .then(function (names) { names.forEach(function (name) { caches.delete(name); }); })
          .catch(function(){});
      }
    })();
  </script>
